name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # Dedicated, licensed Windows build runner. Never runs pull_request code.
    runs-on: [self-hosted, Windows, X64, gss-release]
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check tag and publication policy
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') { throw 'Select a version tag when dispatching' }
          $version = (Get-Content apps/desktop/electron/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match package version' }
          $policy = Get-Content release-policy.json -Raw | ConvertFrom-Json
          if (!$policy.releaseEnabled -or $policy.projectLicense -eq 'pending' -or $policy.commonAssetsRedistribution -ne 'confirmed' -or $policy.runtimeToolsRedistribution -ne 'confirmed') { throw 'Resolve the documented license, asset attribution and runtime tool inputs before public release' }
      - name: Install dependencies
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Run checks
        shell: pwsh
        env:
          GSS_TOOLS: ${{ vars.GSS_TOOLS }}
        run: |
          $env:PATH = "$env:GSS_TOOLS;$env:PATH"
          ./.venv/Scripts/python.exe scripts/check.py
          if ($LASTEXITCODE) { throw 'Source checks failed' }
          node --test apps/desktop/electron/tests/*.test.js
          if ($LASTEXITCODE) { throw 'Node tests failed' }
          Push-Location services/host
          try { & ../../.venv/Scripts/python.exe -m unittest discover -v; if ($LASTEXITCODE) { throw 'Python tests failed' } } finally { Pop-Location }
      - name: Build player and portable package
        shell: pwsh
        env:
          GSS_UNITY: ${{ vars.GSS_UNITY }}
          GSS_TOOLS: ${{ vars.GSS_TOOLS }}
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP ('gss-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          ./scripts/build-player.ps1 -Unity $env:GSS_UNITY -Output "$buildRoot/player" -Report "$buildRoot/report"
          ./.venv/Scripts/python.exe scripts/prepare-python.py --output "$buildRoot/python"
          if ($LASTEXITCODE) { throw 'Python runtime preparation failed' }
          ./.venv/Scripts/python.exe scripts/package.py --python "$buildRoot/python" --tools "$env:GSS_TOOLS" --player "$buildRoot/player" --output "$buildRoot/GSS-Windows-x64"
          if ($LASTEXITCODE) { throw 'Packaging failed' }
          ./.venv/Scripts/python.exe scripts/verify-package.py "$buildRoot/GSS-Windows-x64"
          if ($LASTEXITCODE) { throw 'Portable package verification failed' }
          "GSS_BUILD_ROOT=$buildRoot" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            ${{ env.GSS_BUILD_ROOT }}/GSS-Windows-x64.zip
            ${{ env.GSS_BUILD_ROOT }}/GSS-Windows-x64.zip.sha256
            ${{ env.GSS_BUILD_ROOT }}/report/unity-checks.json
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes "${options[@]}"
