name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-lock.txt
      - run: python scripts/check.py
      - run: node --test apps/desktop/electron/tests/*.test.js
      - name: Install media test dependency
        run: choco install ffmpeg --no-progress -y
      - run: python -m unittest discover -v
        working-directory: services/host
